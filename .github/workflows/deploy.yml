name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # refresh pinned repos every night
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Fetch pinned repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # provided automatically, nothing to set up
        run: |
          nix run .#pinned -- h4shcore || echo "pinned fetch failed, using committed data/pinned.json if any"
          git add -f data/pinned.json || true

      - name: Build site
        run: |
          nix build
          cp -rL result site
          chmod -R u+w site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
